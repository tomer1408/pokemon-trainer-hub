name: CI

# Disabled from running automatically (was emailing on every push to main) —
# kept as a manual-only workflow instead of deleted, so it's easy to turn
# back on later: just restore the push/pull_request triggers below.
on:
  workflow_dispatch: {}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokemon-trainer-hub-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: pokemon-trainer-hub-server/package-lock.json
      - run: npm ci
      - run: npm test

  client-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokemon-trainer-hub-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: pokemon-trainer-hub-client/package-lock.json
      - run: npm ci
      - run: npm test
